version: "3"

tasks:
  default:
    desc: Show help
    cmds:
      - task --list

  deps:
    desc: Download dependencies
    cmds:
      - go mod tidy
      - go mod download

  build:
    desc: Build binary
    deps: [deps]
    env:
      CGO_ENABLED: "1"
    sources:
      - ./**/*.go
    generates:
      - conduit
    cmds:
      - go build -ldflags "-s -w" -o conduit .

  tests:
    desc: Run tests
    deps: [deps]
    cmds:
      - go test -v ./...

  run:
    desc: Run project
    deps: [deps]
    cmds:
      - go run .

  demo:
    desc: Record the terminal demo
    deps: [build]
    vars:
      TAPE: '{{default "docs/demo.tape" .TAPE}}'
    cmds:
      - test -n "$MYSQL_USER"
      - test -n "$MYSQL_PWD"
      - test -n "$PROFILE"
      - test -n "$CHROME"
      - vhs {{.TAPE}}

  clean:
    desc: Remove build cache
    cmds:
      - go clean
